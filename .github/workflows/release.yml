name: Release

# A pushed v<version> tag builds the Mac app on Apple silicon and publishes a GitHub Release with
# the installer, its checksum, the CLI bundle and notes from CHANGELOG.md. Pull requests that touch
# the app run the same build and checks without publishing. See docs/DISTRIBUTION.md.

on:
  push:
    tags: ['v*.*.*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/release/**
      - apps/desktop/**
      - packages/ui/**
      - packages/core/**
      - design/icon/**
      - CHANGELOG.md
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  package:
    name: Package macOS app
    runs-on: macos-15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for the release notes' compare link

      - name: Check version
        id: version
        run: |
          tag=""
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"; fi
          echo "version=$(node scripts/release/check-version.mjs $tag)" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4 # version from package.json's packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Build the installer
        env:
          # Developer ID signing and notarization; unset on pull requests from forks, which then
          # build ad hoc. See docs/DISTRIBUTION.md.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          if ! pnpm --filter @trove/desktop dist 2>&1 | tee "$RUNNER_TEMP/dist.log"; then
            # Put the end of the output in the check's annotation, which the checks API returns
            # even where the full job log can't be downloaded.
            tail -n 40 "$RUNNER_TEMP/dist.log" | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN { ORS = "%0A" } { print }' > "$RUNNER_TEMP/dist.tail"
            echo "::error title=electron-builder failed::$(cat "$RUNNER_TEMP/dist.tail")"
            exit 1
          fi

      - name: Check the app
        working-directory: apps/desktop/release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Every check runs and reports by name, so one failure doesn't hide the rest.
          app=mac-arm64/Trove.app
          plist="$app/Contents/Info.plist"
          failed=0
          check() { # name, then a command that must succeed
            local name="$1"; shift
            if out="$("$@" 2>&1)"; then echo "ok   $name"; else echo "::error title=$name::${out//$'\n'/%0A}"; failed=1; fi
          }
          version_is() { v="$(plutil -extract CFBundleShortVersionString raw "$plist")"; [ "$v" = "$VERSION" ] || { echo "Info.plist says $v, expected $VERSION"; return 1; }; }
          icon_is_ours() {
            icon="$(plutil -extract CFBundleIconFile raw "$plist")" || return 1
            file="$app/Contents/Resources/${icon%.icns}.icns"
            cmp "$file" ../assets/icon.icns || { echo "CFBundleIconFile=$icon; $(ls -l "$app/Contents/Resources" | grep -i icns)"; return 1; }
          }
          developer_id() { d="$(codesign -dv --verbose=2 "$app" 2>&1)"; grep -q 'Authority=Developer ID Application' <<<"$d" || { echo "$d"; return 1; }; }
          arm64() { a="$(lipo -archs "$app/Contents/MacOS/Trove")"; [ "$a" = arm64 ] || { echo "archs: $a"; return 1; }; }
          check "Version is $VERSION" version_is
          check "Icon is assets/icon.icns" icon_is_ours
          check "Signature verifies" codesign --verify --deep --strict "$app"
          if [ "$GITHUB_REF_TYPE" = tag ]; then # releases must open without a Gatekeeper prompt
            check "Signed with Developer ID" developer_id
            check "Notarized" xcrun stapler validate "$app"
            check "Gatekeeper accepts it" spctl --assess --type execute --verbose=2 "$app"
          fi
          check "Built for arm64" arm64
          pty=$app/Contents/Resources/app.asar.unpacked/out/node-pty/build/Release
          check "Terminal's pty.node is unpacked" test -f "$pty/pty.node"
          check "Terminal's spawn-helper is signed" codesign --verify --strict "$pty/spawn-helper"
          check "Installer is named for the release" test -f "Installer-Trove-$VERSION-arm64.dmg"
          ls -l . "$app/Contents/Resources" | head -40
          exit $failed

      - name: Stage release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/release" && cd "$RUNNER_TEMP/release"
          dmg="Installer-Trove-$VERSION-arm64.dmg"
          cp "$GITHUB_WORKSPACE/apps/desktop/release/$dmg" .
          cp "$GITHUB_WORKSPACE/plugins/trove/dist/trove.mjs" "trove-$VERSION.mjs"
          shasum -a 256 "$dmg" > "Checksum-Trove-$VERSION-arm64.dmg.sha256"
          shasum -a 256 "trove-$VERSION.mjs" > "Checksum-trove-$VERSION.mjs.sha256"
          node "$GITHUB_WORKSPACE/scripts/release/release-notes.mjs" "$VERSION" --repo "$GITHUB_REPOSITORY" > release-notes.md
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: trove-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/release
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.package.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: trove-${{ needs.package.outputs.version }}
          path: release

      - name: Attest the installer and CLI
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/Installer-Trove-${{ needs.package.outputs.version }}-arm64.dmg
            release/trove-${{ needs.package.outputs.version }}.mjs

      - name: Create the release
        working-directory: release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "Installer-Trove-$VERSION-arm64.dmg" \
            "Checksum-Trove-$VERSION-arm64.dmg.sha256" \
            "trove-$VERSION.mjs" \
            "Checksum-trove-$VERSION.mjs.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Trove $VERSION" \
            --notes-file release-notes.md \
            --verify-tag \
            --latest
