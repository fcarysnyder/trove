appId: com.fcarysnyder.trove
productName: Trove
copyright: Copyright © 2026 F Cary Snyder
directories:
  output: release
  buildResources: assets
# main bundles @trove/core and out/ui holds @trove/ui's build (see electron.vite.config.ts), so the
# app needs nothing from node_modules.
files:
  - out/**
  - package.json
  # The Dock icon's two appearances, which the app swaps between while it runs.
  - assets/icon.png
  - assets/icon-light.png
  - "!node_modules/**"
# Package the Electron binary in node_modules. Electron 45 no longer downloads it on install, so the
# package and dist scripts run install-electron first (a no-op once it is there).
electronDist: node_modules/electron/dist
npmRebuild: false
afterPack: scripts/adhoc-sign.cjs
mac:
  target: [dir, dmg]
  # icon.icns carries simplified 16/32pt art; regenerate with design/icon/src/export.py
  icon: assets/icon.icns
  category: public.app-category.developer-tools
  # Release tags sign with the Developer ID certificate in CSC_LINK and notarize with APPLE_ID,
  # APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID (see docs/DISTRIBUTION.md). Without them, as in a
  # local build, electron-builder finds no identity and skips both, and scripts/adhoc-sign.cjs signs
  # the bundle ad hoc instead, because Apple silicon will not run it unsigned.
  hardenedRuntime: true
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist
  notarize: true
dmg:
  # Release asset names follow Installer-<App>-<version>-<arch>.dmg.
  artifactName: "Installer-${productName}-${version}-${arch}.${ext}"
