appId: com.fcarysnyder.trove
productName: Trove
copyright: Copyright © 2026 F Cary Snyder
directories:
  output: release
  buildResources: assets
# main bundles @trove/core, out/ui holds @trove/ui's build and out/node-pty the terminal's native
# module (see electron.vite.config.ts), so the app needs nothing from node_modules.
files:
  - out/**
  - package.json
  # The Dock icon's two appearances, which the app swaps between while it runs.
  - assets/icon.png
  - assets/icon-light.png
  - "!node_modules/**"
# pty.node and spawn-helper cannot run from inside the asar.
asarUnpack:
  - out/node-pty/**
# Package the Electron binary in node_modules. Electron 45 no longer downloads it on install, so the
# package and dist scripts run install-electron first (a no-op once it is there).
electronDist: node_modules/electron/dist
npmRebuild: false
afterPack: scripts/adhoc-sign.cjs
mac:
  target: [dir, dmg]
  # icon.icns carries simplified 16/32pt art; regenerate with design/icon/src/export.py
  icon: assets/icon.icns
  category: public.app-category.developer-tools
  # Signed with the Developer ID certificate in CSC_LINK (or the keychain) and notarized when the
  # APPLE_* variables are set; without them electron-builder skips both and the ad-hoc signature
  # from scripts/adhoc-sign.cjs stands (see docs/DISTRIBUTION.md).
  hardenedRuntime: true
dmg:
  # Release asset names follow Installer-<App>-<version>-<arch>.dmg.
  artifactName: "Installer-${productName}-${version}-${arch}.${ext}"
